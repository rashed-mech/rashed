<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var cached = JSON.parse(localStorage.getItem('portfolio_data_cache_v2') || '{}');
          var design = cached.themeUX && cached.themeUX.activeDesign || 'design-5';
          var isReference = design === 'design-7' && !window.location.pathname.startsWith('/admin');
          var isDark = !isReference && (saved !== null ? saved === 'dark' : true);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#080d14';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = isReference ? '#b4b4b4' : '#f3f5ef';
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rashedul Islam | Mechanical Engineer</title>
    <meta name="description" content="Designing, modelling, and field-testing off-grid hybrid renewable energy systems — solar, wind, biogas, and battery — for coastal and resource-constrained communities in Bangladesh." />
