<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio_theme_v2');
          var cached = JSON.parse(localStorage.getItem('portfolio_public_cache_v3') || '{}');
          var design = cached.themeUX && cached.themeUX.activeDesign || 'design-5';
          var isReference = design === 'design-7' && !window.location.pathname.startsWith('/admin');
          var isDark = !isReference && saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#080d14';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = isReference ? '#b4b4b4' : '#f3f5ef';
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rashedul Islam | Mechanical Engineer</title>
    <meta name="description" content="Designing, modelling, and field-testing off-grid hybrid renewable energy systems — solar, wind, biogas, and battery — for coastal and resource-constrained communities in Bangladesh." />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f3f5ef" />
    <!-- Above-the-fold images: fetch immediately instead of after the JS bundle runs -->
    <link rel="preload" as="image" href="/avatar.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo-circle.webp" type="image/webp" />
    <!-- Typeface used across the portfolio (was referenced but never loaded) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'" />
    <!-- Remaining Google Drive images (not yet mirrored by npm run media:sync) -->
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
  </head>
  <body class="dark:bg-[#080d14] bg-[#E4E7EB] dark:text-slate-100 text-slate-900 antialiased selection:bg-[#d4af37]/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
