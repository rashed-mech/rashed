[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  # The isolated MongoDB server is a test dependency, never needed for builds.
  MONGOMS_DISABLE_POSTINSTALL = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongodb"]

# Route all /api/* calls to the bundled Express app (single serverless function).
# Express handles the actual sub-routing (e.g. /api/health, /api/portfolio, etc.)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback so client-side routing works on refresh / deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for fingerprinted bundles and mirrored media.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
