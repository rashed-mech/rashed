<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1118"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="44"/>
    </clipPath>
  </defs>
  
  <!-- Outer round container with transparent corners -->
  <g clip-path="url(#circleClip)">
    <circle cx="50" cy="50" r="44" fill="url(#bg)"/>
    <!-- Energy ring -->
    <circle cx="50" cy="50" r="32" stroke="url(#tealGrad)" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.8"/>
    <!-- Compass / Solar rays -->
    <path d="M50 18 L50 28 M50 72 L50 82 M18 50 L28 50 M72 50 L82 50" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Central Dynamic Star / Turbine motif -->
    <path d="M50 24 L56 44 L76 50 L56 56 L50 76 L44 56 L24 50 L44 44 Z" fill="url(#goldGrad)"/>
    <circle cx="50" cy="50" r="6" fill="#0b1118" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="2.5" fill="#fef08a"/>
  </g>
  
  <!-- Crisp high-contrast circular outline border matching header avatar/logo ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#tealGrad)" stroke-width="3.5"/>
</svg>
